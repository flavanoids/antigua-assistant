# ── Known gaps ───────────────────────────────────────────────────────────────
# Real divergences between documented behaviour and actual routing, found when
# this harness was first run (2026-07-27). Not fixed here — Phase 0 builds the
# net, it does not swing at what falls into it.

known_gaps:

  - utterance: what do you remember about katherine
    expected: memory_query
    actual: llm
    note: >
      "what do you remember about X" is not matched by is_memory_query(),
      so the memory store is never consulted and the LLM answers from nothing.

# The offline cookbook's dish list (scripts/build_cookbook.py).
#
# Each dish is searched like "how do I make <dish>" would be, and only recipes
# rated 4.5 or better by at least 50 people are kept (recipe.COOKBOOK_MIN_*),
# up to 3 per dish. A dish with no recipe that popular stays online-only.
# "dish | alias, alias" adds names that find the same entry.
# Recipes asked for by voice join the cookbook on their own when they clear
# the same bar, so this list is a head start, not the limit.


# Installed as a drop-in, /etc/systemd/system/<unit>.service.d/30-hardening.conf,
# for every Antigua service: antigua-server, antigua-tts, antigua-whisper and
# kitchen-bridge on the primary; antigua-fallback, kitchen-bridge-standby and
# antigua-tts on the backup (deploy_fallback.sh); antigua-satellite on the Pi.
# The services stay root (the satellite stays its user). This only takes away
# what none of them use, so a bug or a hostile input has less to work with:
#   - new files are private (transcripts, captures, replies, logs);
#   - /usr, /boot and /etc are read-only (they read token files from
#     /etc/antigua, never write there); /home and /var stay writable;
#   - a private /tmp; no setuid escalation; no kernel tunables, modules, logs,
#     clock or cgroup changes; no new namespaces.
# No PrivateDevices: whisper.cpp needs the GPU (/dev/dri, /dev/kfd).
[Service]
UMask=0077
NoNewPrivileges=yes
RestrictSUIDSGID=yes
PrivateTmp=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
LockPersonality=yes

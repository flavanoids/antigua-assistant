# Lint + the network-free test suites on every push and pull request.
# 3.11 is the oldest interpreter in use (the satellite Pi).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-tts.txt
      - run: sudo apt-get install -y --no-install-recommends espeak-ng   # phonemizer's backend
      - run: pip install -r server/requirements.txt -r server/requirements-tts.txt pytest ruff   # test_tts_voice imports the TTS server
      - run: ruff check .
      - run: pytest -v

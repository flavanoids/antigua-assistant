# Lint + the network-free test suites on every push and pull request.
# 3.11 is the oldest interpreter in use (the satellite Pi).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-tts.txt
      - run: pip install -r server/requirements.txt pytest ruff
      # The TTS server (numpy>=2.5) runs on the primary and backup, not on the
      # 3.11 satellite: install it and run its voice suite on 3.13 only.
      - if: matrix.python != '3.11'
        run: |
          sudo apt-get install -y --no-install-recommends espeak-ng
          pip install -r server/requirements-tts.txt
      - run: ruff check .
      - run: pytest -v ${{ matrix.python == '3.11' && '--ignore=tests/test_tts_voice.py' || '' }}
